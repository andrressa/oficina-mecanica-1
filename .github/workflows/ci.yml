name: CI Oficina
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar configuração
        run: python oficina_mecanica/manage.py check
      - name: Verificar migrações pendentes
        run: python oficina_mecanica/manage.py makemigrations --check --dry-run
      - name: Criar banco temporário
        run: python oficina_mecanica/manage.py migrate --noinput
      - name: Testar API
        run: python oficina_mecanica/manage.py test core
